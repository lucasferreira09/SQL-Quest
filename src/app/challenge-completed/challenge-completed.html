<div class="completed-container">

  <div class="background"></div>

  <div class="overlay"></div>

  <div class="completed-content">

    <button class="back-button"
      type="button"
      (click)="back()">
      <img src="/assets/back22.png" alt="Voltar">
      <span>Back</span>
    </button>

    <main class="completion">
      <div class="check-icon">
        <img src="/assets/challenge_check.png" alt="Desafio concluído">
      </div>

      <h1>CONGRATULATIONS!</h1>

      <p class="message">
        You've done the challenge successfully!
      </p>

      <div class="result-panel">

        <div class="result-item">
          <span class="result-label">XP earned</span>
          <span class="result-value">⭐ {{ xp }} XP</span>
        </div>

        <div class="divider"></div>

        <div class="result-item">
          <span class="result-label">Difficulty</span>
          <span class="difficulty">{{ difficulty }}</span>
        </div>

      </div>

      <button class="next-button"
        type="button"
        (click)="nextChallenge()">
        <span>Next Challenge</span>
        <span class="arrow">→</span>
      </button>

    </main>

  </div>

</div>
